services:
  web:
    build:
      context: .
      dockerfile: Dockerfile.dev
    ports:
      - "8000:8000"
      - "5678:5678"  # Debug port for debugpy
    environment:
      - DATABASE_URL=postgresql://postgres:password@db:5432/newsdb_dev
      - REDIS_URL=redis://redis:6379/0
      - DEBUG=true
      - LOG_LEVEL=DEBUG
      - DATA_SOURCE=database
      - PYTHONPATH=/app
      - PYTHONUNBUFFERED=1
    depends_on:
      - db
      - redis
    env_file:
      - .env.dev
    volumes:
      - ./src:/app/src:rw
      - ./tests:/app/tests:rw
      - ./examples:/app/examples:rw
      - ./requirements.txt:/app/requirements.txt:ro
      - ./requirements-dev.txt:/app/requirements-dev.txt:ro
      - ./.pre-commit-config.yaml:/app/.pre-commit-config.yaml:ro
      - ./pyproject.toml:/app/pyproject.toml:ro
    command: >
      sh -c "
        pip install -e . &&
        pip install -r requirements-dev.txt &&
        pre-commit install &&
        uvicorn src.main:app --host 0.0.0.0 --port 8000 --reload --reload-dir src
      "
    restart: unless-stopped
    stdin_open: true
    tty: true

  db:
    image: postgres:15-alpine
    platform: linux/arm64/v8
    environment:
      - POSTGRES_DB=newsdb_dev
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=password
    volumes:
      - postgres_dev_data:/var/lib/postgresql/data
      - ./scripts/init-db.sql:/docker-entrypoint-initdb.d/init-db.sql:ro
    ports:
      - "5433:5432"  # Different port to avoid conflicts
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 30s
      timeout: 10s
      retries: 3

  redis:
    image: redis:7-alpine
    platform: linux/arm64/v8
    ports:
      - "6380:6379"  # Different port to avoid conflicts
    volumes:
      - redis_dev_data:/data
    command: redis-server --appendonly yes --maxmemory 128mb --maxmemory-policy allkeys-lru
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Development tools
  jupyter:
    build:
      context: .
      dockerfile: Dockerfile.dev
    ports:
      - "8888:8888"
    environment:
      - DATABASE_URL=postgresql://postgres:password@db:5432/newsdb_dev
      - REDIS_URL=redis://redis:6379/0
      - JUPYTER_ENABLE_LAB=yes
    depends_on:
      - db
      - redis
    volumes:
      - ./src:/app/src:rw
      - ./notebooks:/app/notebooks:rw
      - ./data:/app/data:rw
    command: >
      sh -c "
        pip install -e . &&
        pip install -r requirements-dev.txt &&
        jupyter lab --ip=0.0.0.0 --port=8888 --no-browser --allow-root --notebook-dir=/app
      "
    restart: unless-stopped

  # Database admin interface
  pgadmin:
    image: dpage/pgadmin4:latest
    platform: linux/arm64/v8
    environment:
      - PGADMIN_DEFAULT_EMAIL=admin@example.com
      - PGADMIN_DEFAULT_PASSWORD=admin
      - PGADMIN_CONFIG_SERVER_MODE=False
    ports:
      - "5050:80"
    depends_on:
      - db
    volumes:
      - pgadmin_dev_data:/var/lib/pgadmin
    restart: unless-stopped

  # Redis admin interface (ARM64 compatible)
  redis-admin:
    image: redis/redisinsight:latest
    platform: linux/arm64/v8
    ports:
      - "8081:8001"
    environment:
      - RIPORT=8001
      - RIHOMEDIR=/db
    volumes:
      - redis_admin_data:/db
    depends_on:
      - redis
    restart: unless-stopped

  # Alternative Redis CLI access via web interface
  redis-web:
    image: erikdubbelboer/phpredisadmin:latest
    platform: linux/arm64/v8
    ports:
      - "8082:80"
    environment:
      - ADMIN_USER=admin
      - ADMIN_PASS=admin
      - REDIS_1_HOST=redis
      - REDIS_1_PORT=6379
    depends_on:
      - redis
    restart: unless-stopped
    profiles:
      - redis-web

  # Load testing tool
  locust:
    build:
      context: .
      dockerfile: Dockerfile.dev
    ports:
      - "8089:8089"
    environment:
      - LOCUST_HOST=http://web:8000
    volumes:
      - ./tests/load_tests:/app/load_tests:ro
    command: >
      sh -c "
        pip install locust &&
        locust -f load_tests/locustfile.py --host=http://web:8000
      "
    depends_on:
      - web
    restart: unless-stopped
    profiles:
      - load-test

  # Documentation server
  docs:
    build:
      context: .
      dockerfile: Dockerfile.dev
    ports:
      - "8080:8080"
    volumes:
      - ./docs:/app/docs:rw
      - ./src:/app/src:ro
    command: >
      sh -c "
        pip install mkdocs mkdocs-material &&
        mkdocs serve --dev-addr=0.0.0.0:8080
      "
    restart: unless-stopped
    profiles:
      - docs

volumes:
  postgres_dev_data:
  redis_dev_data:
  pgadmin_dev_data:
  redis_admin_data:

networks:
  default:
    driver: bridge
